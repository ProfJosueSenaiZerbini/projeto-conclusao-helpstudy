<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Estudos · HelpStudy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/plano.css">
<link rel="stylesheet" href="/css/darkmode.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar__logo">
            <span class="icon-mark"><i class="fa-solid fa-graduation-cap"></i></span>
            HelpStudy
        </div>
        <nav class="sidebar__nav">
            <a href="/dashboard"><i class="fa-solid fa-table-cells-large"></i> Início</a>
            <a href="/enem"><i class="fa-solid fa-file-pen"></i> Questões do ENEM</a>
            <a href="/progresso"><i class="fa-solid fa-chart-line"></i> Meu progresso</a>
            <a href="/plano" class="active"><i class="fa-solid fa-list-check"></i> Plano de estudos</a>
        </nav>
        <div class="sidebar__footer">
            <a href="#" data-logout><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
        </div>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <div class="topbar__left">
                <button class="theme-toggle menu-btn" data-menu-toggle aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
                <h2 class="topbar__title">Plano de estudos</h2>
            </div>
            <div class="topbar__right">
                <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
                <span class="topbar__sep"></span>
                <div class="user-chip">
                    <span class="user-chip__avatar" data-user-initials>?</span>
                    <span data-user-name>Aluno</span>
                </div>
            </div>
        </header>

        <div class="card plano-intro">
            <div class="plano-intro__text">
                <div class="plano-intro__icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <div>
                    <h1>Seu plano personalizado</h1>
                    <p>Gerado automaticamente com base no seu desempenho em cada matéria.</p>
                </div>
            </div>
            <button class="btn btn-outline" id="btn-regerar"><i class="fa-solid fa-arrows-rotate"></i> Atualizar plano</button>
        </div>

        <div class="plano-lista" id="plano-lista">
            <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Carregando seu plano...</div>
        </div>
    </main>
</div>

<script src="/js/darkmode.js"></script>
<script src="/js/api.js"></script>
<script src="/js/plano.js"></script>
</body>
</html>
