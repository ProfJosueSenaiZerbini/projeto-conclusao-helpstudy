<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Help Study - Exercícios</title>

    <!-- Bootstrap -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Font Awesome -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link
    rel="stylesheet"
    href="../public/css/exercicios.css">

</head>

<body>

<div class="container">

    <!-- Cabeçalho -->

    <header class="topo">

        <div>

            <h2 id="nomeMateria">

                Matemática

            </h2>

            <p>

                Responda todas as questões.

            </p>

        </div>

        <div class="cronometro">

            <i class="fa-solid fa-clock"></i>

            <span id="tempo">

                10:00

            </span>

        </div>

    </header>

    <!-- Barra -->

    <div class="progress mb-4">

        <div
            id="barraQuestao"
            class="progress-bar bg-primary"
            style="width:10%;">

        </div>

    </div>

    <!-- Questão -->

    <div class="card-pergunta">

        <h4 id="numeroQuestao">

            Questão 1 de 10

        </h4>

        <h3 id="pergunta">

            Carregando pergunta...

        </h3>

        <form id="formAlternativas">

        </form>

    </div>

        <div class="botoes">

        <button
            id="anterior"
            class="btn btn-secondary">

            Anterior

        </button>

        <button
            id="proximo"
            class="btn btn-primary">

            Próxima

        </button>

    </div>

</div>

<script src="../public/js/exercicios.js"></script>

</body>

</html>
