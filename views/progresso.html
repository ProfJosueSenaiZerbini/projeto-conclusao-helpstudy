<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Progresso · HelpStudy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/progresso.css">
<link rel="stylesheet" href="/css/resultado.css">
<link rel="stylesheet" href="/css/darkmode.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar__logo">
            <span class="icon-mark"><i class="fa-solid fa-graduation-cap"></i></span>
            HelpStudy
        </div>
        <nav class="sidebar__nav">
            <a href="/dashboard"><i class="fa-solid fa-house"></i> Início</a>
            <a href="/progresso" class="active"><i class="fa-solid fa-chart-line"></i> Meu progresso</a>
            <a href="/plano"><i class="fa-solid fa-list-check"></i> Plano de estudos</a>
        </nav>
        <div class="sidebar__footer">
            <a href="#" data-logout><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
        </div>
    </aside>

    <main class="main-area">
        <div class="topbar">
            <h2>Meu progresso</h2>
            <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="progresso-grid">
            <div class="card chart-card">
                <h3>Seu progresso geral</h3>
                <div class="donut-wrap" id="donut-geral"></div>
            </div>
            <div class="card chart-card">
                <h3>Desempenho por matéria</h3>
                <div id="barras-materia"></div>
            </div>
        </div>

        <div class="card evolucao-card">
            <h3>Evolução dos últimos 7 dias</h3>
            <canvas id="grafico-evolucao" height="90"></canvas>
        </div>

        <div class="progresso-grid" style="grid-template-columns: 1fr;">
            <div class="card chart-card">
                <h3>🏅 Conquistas</h3>
                <div class="conquistas-grid" id="conquistas-grid"></div>
            </div>
        </div>

        <div class="card panel" style="margin-top:22px;">
            <h3>Respostas recentes</h3>
            <div id="historico-recente" style="margin-top:14px;"></div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/js/darkmode.js"></script>
<script src="/js/api.js"></script>
<script src="/js/progresso.js"></script>
</body>
</html>
